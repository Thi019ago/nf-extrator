services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nf
      POSTGRES_PASSWORD: nf
      POSTGRES_DB: nf_extrator
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nf -d nf_extrator"]
      interval: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://nf:nf@db:5432/nf_extrator
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
